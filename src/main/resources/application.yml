build:
  name: '@build.number@'
  version: '@project.version@'
  timestamp: '@build.timestamp@'

logs:
  base:
    dir: logs

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

spring:
  profiles:
    active:
      - local # spring boot profile
